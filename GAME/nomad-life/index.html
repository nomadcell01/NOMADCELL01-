<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOMAD — Simulation de vie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading">NOMAD — entrée dans le monde…</div>
<div id="game">
  <div id="hud"><span>NOMAD TERRE</span><span id="clock">08:00</span><span id="money">N$ 500</span></div>
  <div id="hint">Bienvenue chez NOMAD. Vis ta vie.</div>
  <div id="actions">
    <button id="work">Travail</button>
    <button id="home">Maison</button>
    <button id="catalog">Acheter</button>
  </div>
  <div id="touch">
    <button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button>
    <button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
setTimeout(function(){
  if(!window.THREE){
    var s=document.createElement('script');
    s.src='https://unpkg.com/three@0.180.0/build/three.min.js';
    s.onload=function(){var g=document.createElement('script');g.src='game.js';document.body.appendChild(g)};
    s.onerror=function(){document.getElementById('loading').textContent='Le moteur 3D n’a pas pu démarrer. Recharge la page.'};
    document.body.appendChild(s);
  } else {
    var g=document.createElement('script');g.src='game.js';document.body.appendChild(g);
  }
},50);
</script>
</body>
</html>
