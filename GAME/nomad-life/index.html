<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOMAD — Simulation de vie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading">NOMAD — entrée dans le monde…</div>
<div id="game">
  <div id="hud"><span>NOMAD TERRE</span><span id="clock">08:00</span><span id="money">N$ 500</span></div>
  <div id="hint">Bienvenue chez NOMAD. Vis ta vie.</div>
  <div id="actions">
    <button id="work">Travail</button>
    <button id="home">Maison</button>
    <button id="catalog">Acheter</button>
  </div>
  <div id="touch">
    <button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button>
    <button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
  </div>
</div>
<script type="module">
(async () => {
  const loading = document.getElementById('loading');
  try {
    loading.textContent = 'NOMAD — chargement du monde 3D…';
    const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    window.THREE = THREE;
    const script = document.createElement('script');
    script.src = 'game.js';
    script.onload = () => { loading.style.display = 'none'; };
    script.onerror = () => { loading.textContent = 'Impossible de charger le monde NOMAD.'; };
    document.body.appendChild(script);
  } catch (e) {
    console.error(e);
    loading.textContent = 'Le moteur 3D n’a pas pu être chargé. Vérifie la connexion puis recharge.';
  }
})();
</script>
</body>
</html>
