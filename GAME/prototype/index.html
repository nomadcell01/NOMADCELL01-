<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOMAD — Simulation de vie</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="game">
<header><div class="brand">NOMAD</div><div class="status"><span id="worldName">NOMAD TERRE</span><span>·</span><span id="clock">08:00</span><span>·</span><span>💰 <b id="money">1 000</b> N$</span></div></header>
<main><canvas id="gameCanvas"></canvas><div id="loading">NOMAD se prépare…</div>
<div id="context" class="hidden"><b id="contextTitle"></b><span id="contextText"></span><button id="contextAction"></button></div>
<div id="message">Bienvenue. Tu arrives dans une ville NOMAD déjà construite.</div>
<div id="controls"><span>WASD / flèches</span><span>•</span><span>glisser pour regarder</span><span>•</span><span>approche-toi des lieux</span></div>
<div id="lifeMenu"><button id="workBtn">💼 Travail</button><button id="buyBtn">🛋️ Acheter</button><button id="worldBtn">🌍 Monde</button></div>
<div id="worlds" class="panel hidden"><button class="close" id="closeWorlds">×</button><h2>Où veux-tu vivre ?</h2><p>Chaque monde possède déjà sa ville NOMAD.</p><div id="worldList"></div></div>
<div id="catalog" class="panel hidden"><button class="close" id="closeCatalog">×</button><h2>🛋️ Acheter</h2><p>Achète des objets pour ton habitat.</p><div id="items"></div></div>
</main></div><script type="module" src="game.js"></script></body></html>
