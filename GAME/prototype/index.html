<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOMAD GAME — Prototype 0.2</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>NOMAD GAME</h1><span>Prototype Terre · offline-first · sauvegarde locale</span></header>
<main><section id="world"><div id="terrain"><div class="water"></div><div class="hub"><b>HUB NOMAD</b><small>visiter · habiter · travailler</small></div><div class="module" id="module"><b>Module NOMAD</b><small>habitation</small></div><div class="park" id="park"><b>PARC</b><small>activité</small></div><div class="factory"><b>USINE</b><small>production</small></div><div id="player">●</div></div></section>
<aside><h2>Construction</h2><button data-build="module">Construire un module (50)</button><button data-build="road">Tracer une route (20)</button><button id="canal">Creuser un canal (15)</button><button id="rain">🌧️ Déclencher forte pluie</button><button id="parkGame">Jouer au parc (+15)</button><button id="workGame">Mini-jeu usine (+10)</button><hr><h2>Économie</h2><button id="buy">Acheter au HUB : 50 matériaux (25)</button><button id="sell">Revendre 20 matériaux (+15)</button><p>💰 Pièces : <strong id="coins">100</strong></p><p>🧱 Matériaux : <strong id="materials">100</strong></p><p>📍 Position : <strong id="pos">HUB</strong></p><div class="controls"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><button id="save">💾 Sauvegarder</button><button id="reset">↺ Nouvelle partie</button><button id="voice">🎙️ Petite voix</button><p id="message">Bienvenue dans NOMAD. Le monde est à vous.</p></aside></main><script src="game.js"></script></body></html>
